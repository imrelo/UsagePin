<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>UsagePin animation check</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
      mockWindows("main");
      let enabled = false;
      let calls = 0;
      mockIPC((command) => {
        if (command === "toggle_click_through") {
          if (new URLSearchParams(location.search).has("fail") && calls++ === 0) {
            throw new Error("Test mouse mode failure");
          }
          return enabled = !enabled;
        }
        return null;
      }, { shouldMockEvents: true });
      await import("/frontend/main.tsx");
    </script>
  </body>
</html>
