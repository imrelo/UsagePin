<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b085ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#53c9ff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c1a0ff"/>
      <stop offset="1" stop-color="#67d7ff"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.7"/>
    </filter>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="15"/>
    </clipPath>
  </defs>
  <circle cx="16" cy="16" r="15" fill="#14161f"/>
  <circle cx="16" cy="16" r="15" fill="url(#frame)"/>
  <g clip-path="url(#circle)">
    <circle cx="16" cy="16" r="5.4" fill="#71bbff" opacity=".6" filter="url(#glow)"/>
  </g>
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="url(#border)"/>
  <circle cx="16" cy="16" r="5.4" fill="url(#dot)"/>
</svg>
